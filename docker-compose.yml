version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: pickup-counter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: snack_ordering_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snack_ordering_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pickup-counter-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/snack_ordering_db
      WEBHOOK_SECRET: pickup_counter_webhook_secret_key_2026
      HOLD_DURATION_SECONDS: 120
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pickup-counter-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
