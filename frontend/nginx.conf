server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API requests
    location /products {
        proxy_pass http://backend:4000;
    }
    location /orders {
        proxy_pass http://backend:4000;
    }
    location /payments {
        proxy_pass http://backend:4000;
    }
    location /health {
        proxy_pass http://backend:4000;
    }
}
